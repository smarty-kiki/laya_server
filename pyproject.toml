[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-server"
version = "0.1.0"
description = "Jev-compatible HTTP server backed by local laya-mlx typed-decision inference on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "laya-mlx>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# macOS 原生壳：系统自带的 WebKit，不需要装任何浏览器。
native = [
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
]
# 打包成 .app/.dmg，以及从母版图生成 .icns（packaging/make_icon.py）。
packaging = ["pyinstaller>=6.6.0", "pillow>=10.0"]

[project.scripts]
laya-server = "laya_server.cli:main"
laya-console = "laya_server.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["laya_server"]

[tool.hatch.build.targets.wheel.force-include]
"laya_server/static" = "laya_server/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
